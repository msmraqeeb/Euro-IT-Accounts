<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Euro IT Accounts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>

      body {
        font-family: 'Inter', sans-serif;
      }
      
      /* EXACT MULTI-PAGE A4 PRINT LAYOUT */
      @media print {
        @page {
          size: A4 portrait;
          margin: 0 !important;
        }
        
        html, body, #root, #app-container, main, #main-scroll-container {
          height: auto !important;
          min-height: auto !important;
          max-height: none !important;
          overflow: visible !important;
          width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
          background: #ffffff !important;
          background-color: #ffffff !important;
          display: block !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        /* Hide UI controls */
        aside, nav, .print\:hidden, button, footer, header.print\:hidden {
          display: none !important;
        }

        .agreement-root-wrapper {
          padding: 0 !important;
          margin: 0 !important;
          max-width: none !important;
        }

        .agreement-grid-wrapper {
          display: block !important;
          gap: 0 !important;
          margin: 0 !important;
        }

        .agreement-preview-col {
          display: block !important;
          width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
        }

        .a4-page-sheet {
          width: 210mm !important;
          height: 297mm !important;
          min-height: 297mm !important;
          max-height: 297mm !important;
          margin: 0 auto !important;
          padding: 1in !important; /* EXACT 1 INCH (25.4mm) ON ALL SIDES */
          box-sizing: border-box !important;
          box-shadow: none !important;
          border: none !important;
          border-radius: 0 !important;
          background: #ffffff !important;
          display: flex !important;
          flex-direction: column !important;
          justify-content: space-between !important;
          position: relative !important;
          overflow: hidden !important;
          page-break-inside: avoid !important;
          break-inside: avoid !important;
        }


        .a4-page-1,
        .a4-sheet-wrapper:first-child,
        .a4-page-sheet-1 {
          page-break-after: always !important;
          break-after: page !important;
          page-break-inside: avoid !important;
          break-inside: avoid !important;
        }

        .a4-page-2,
        .a4-sheet-wrapper:last-child,
        .a4-page-sheet-2 {
          page-break-before: always !important;
          break-before: page !important;
          page-break-after: avoid !important;
          break-after: avoid !important;
          page-break-inside: avoid !important;
          break-inside: avoid !important;
        }


        tr {
          break-inside: avoid;
          page-break-inside: avoid;
        }
        
        table {
          width: 100% !important;
          border-collapse: collapse !important;
        }
        
        thead {
          display: table-header-group;
        }

        .report-container {
          box-shadow: none !important;
          border: none !important;
          width: 100% !important;
          max-width: none !important;
          margin: 0 !important;
          padding: 0 !important;
        }
      }


    </style>

{

    "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
  }
}
</script>

</html>
